[project]
name = "claudio"
version = "0.1.0"
description = "CLAUDIO: local Italian voice assistant for Windows"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "JenJo" }]
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "onnxruntime>=1.18,<2",
    "openwakeword==0.6.0",
    "faster-whisper>=1.1.1",
    "piper-tts>=1.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
# CUDA 12.8+ runtime libraries for faster-whisper on the RTX 5070 Ti (Blackwell).
gpu = [
    "nvidia-cublas-cu12>=12.8",
    "nvidia-cudnn-cu12>=9.8,<10",
]

[project.scripts]
claudio = "claudio.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudio"]

[tool.uv]
# CLAUDIO targets Windows only: resolve the lockfile for Windows.
environments = ["sys_platform == 'win32'"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Italian text uses accents and typographic quotes

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: needs downloaded models or audio hardware"]
addopts = "-m 'not slow'"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
