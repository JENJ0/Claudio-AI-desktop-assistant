# Claude API prices, in US dollars per million tokens (Anthropic bills in USD).
# Checked on 2026-10-19 against Anthropic's model table; update here when they change,
# never in the code. The spending counter (src/claudio/cost/) reads this file at start.
#
# A cache write costs the input price times the multiplier of its TTL; a cache read costs
# `cache_read` (when a model leaves it out: input x cache_read_multiplier).
# Haiku 5.5 doubles its prices above 100K input tokens: CLAUDIO's requests stay far below.

currency = "USD"
cache_write_5m_multiplier = 1.25
cache_write_1h_multiplier = 2.0
cache_read_multiplier = 0.1

[models.claude-haiku-5-5]
input = 0.10
output = 0.50

[models.claude-sonnet-5-5]
input = 2.00
output = 10.00
cache_read = 0.20

[models.claude-opus-5-5]
input = 4.00
output = 20.00
cache_read = 0.20
