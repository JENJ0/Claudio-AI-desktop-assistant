# CLAUDIO configuration. Every value can be overridden with an environment
# variable or .env entry: CLAUDIO_<SECTION>__<KEY>, e.g. CLAUDIO_STT__DEVICE=cpu.
# Relative paths are resolved from the project root.

language = "it"            # it | en: CLAUDIO's own messages (console, --check)
models_dir = "models"
logs_dir = "logs"
data_dir = "data"          # what Claudio keeps between runs (microphone level...)

[audio]
# Device name (or part of it) or index; empty = Windows default.
# List devices with: uv run python scripts/list_audio_devices.py
input_device = ""          # e.g. "C270"
output_device = ""         # empty = whatever Windows is using when Claudio speaks
sample_rate = 16000        # required by openWakeWord, Silero and Whisper
block_ms = 80              # openWakeWord works on 80 ms frames
output_sample_rate = 24000 # Kokoro; Piper (22050 Hz) is resampled
beep_volume = 0.25
input_gain_db = 0.0        # digital boost of the microphone, in dB (where auto_gain starts)
auto_gain = true           # Claudio adjusts the boost itself after every request, per microphone

# Wake words: any of the models below wakes CLAUDIO, each with its own threshold.
# "hey_claudio" is trained on JenJo's voice (scripts/wakeword/, models/wakeword/hey_claudio.onnx,
# not in Git). Its threshold comes from scripts/benchmark_wakeword.py. "claudio" alone is trained
# too but hears only 9 takes in 50 and wakes 60 times an hour in the room noise: it stays out
# (add it with its own [[wakeword.models]] block) until it is retrained. v0.1.0 used the
# pre-trained "hey_jarvis" (threshold 0.22).
[wakeword]
near_miss_floor = 0.15     # a score between this and the threshold is a missed wake word (logged)
confirm_below = 0.45       # a wake scoring below this beeps only if Whisper hears the name (~130 ms more)
second_chance = true       # after one, Whisper listens to the last 1.5 s (~130 ms) and wakes CLAUDIO if it hears the name
verify = true              # drop a wake when Whisper did not hear the name at the start and no command matches ("Hey, ciao, come stai?")

[[wakeword.models]]
name = "hey_claudio"
threshold = 0.30           # benchmark on JenJo's 50 takes: 44 heard, 0 false wakes in the room noise

[vad]
threshold = 0.4            # speech probability to count a window as speech (lower = more sensitive)
min_speech_ms = 64         # speech needed to consider the phrase started
end_silence_ms = 400       # silence that closes the phrase
pre_roll_ms = 800          # audio kept before the detected start (soft first words)
no_speech_timeout_s = 4.0  # nothing said after the wake word -> back to idle
max_utterance_s = 8.0

[stt]
model = "large-v3-turbo"
device = "auto"            # auto | cuda | cpu
compute_type = "float16"
fallback_model = "small"
fallback_compute_type = "int8"
# Whisper picks the language of every request among these (the encoder pass is shared, so
# it costs almost nothing); when it is unsure (< language_confidence) it keeps the last one.
# A single language (languages = ["it"]) skips the detection.
languages = ["it", "en"]
language_confidence = 0.6
other_confidence = 0.8         # English (not the first language) must be at least this sure
retry_in_first_language = true # an English request no command understands is retried in Italian
closed_list = true             # a request not understood: Whisper proposes 5 transcriptions, the first known command wins
closed_list_max_words = 5      # longer requests skip it (~150 ms saved): a question for Claude, not a misheard command
beam_size = 5              # on JenJo's recordings: 17/22 commands instead of 14, +2 ms on the GPU
no_speech_threshold = 0.6
cpu_threads = 4

[stt.prompts]              # Whisper's prompt per language: names it would otherwise misspell
it = "Hey Claudio, apri Chrome, apri la cartella Download, Documenti, Esplora file, Blocco note, calcolatrice, alza il volume, abbassa il volume, muto, che ore sono, che giorno è oggi, metti in pausa la musica, canzone successiva, ripeti, basta."
en = "Hey Claudio, open Chrome, open the Downloads folder, Documents, File Explorer, Notepad, calculator, turn up the volume, turn down the volume, mute, what time is it, what day is it, pause the music, next song, repeat, stop."

[tts]
engine = "jack"            # "jack" (Claudio's voice, JenJo 23/10), "kokoro" (Nicola) or "piper"; the others are fallbacks
kokoro_voice = "im_nicola" # Kokoro Italian voices: im_nicola, if_sara
voice = "it_IT-paola-medium" # Piper voice
length_scale = 0.77        # both engines: < 1 speaks faster (0.77 = about 30% faster)
# noise_scale / noise_w_scale (Piper): voice variation (0 = identical every time); unset = default
use_cuda = false           # Piper only
effect = "none"            # none | estremo | jarvis | ultron | ultron_estremo (robotic tone; "none" with Jack)

# engine = "jack": Handsome Jack's voice (Qwen3-TTS + RVC) in a worker process with its own venv.
# If the worker cannot start or answer, Kokoro/Piper speaks. Paths are relative to models/;
# set the effect to "none" with Jack. Personal use only. See README ("Jack's voice").
# jack_python = "voices/jack/worker/env/Scripts/python.exe"
# jack_checkpoint = "voices/jack/ft/0.6B/checkpoint-epoch-5"
# jack_rvc_model = "voices/jack/rvc/Applio/logs/jack/jack_100e_2800s.pth"
# jack_applio = "voices/jack/rvc/Applio"
# jack_startup_timeout_s = 90
# jack_sentence_timeout_s = 15
jack_speed = 0.9           # Jack's pace: < 1 slower (0.9 = 10% slower); the pitch stays the same
first_clause_chars = 25    # the first piece of a reply may end at a comma once this long (0 = off)

[tts.voices.en]            # the voices for English replies (same engine, same effect)
kokoro_voice = "am_michael"
voice = "en_US-ryan-low"

[router]
commands_file = "config/commands.toml"
fuzzy_threshold = 85
unknown_reply = { it = "Questo non lo so ancora fare.", en = "I can't do that yet." }
error_reply = { it = "Non ci sono riuscito.", en = "I couldn't do it." }

[conversation]
window_s = 6.0             # after a reply, listen this long without the wake word (0 = off)
barge_in = true            # "basta" / "stop" while CLAUDIO speaks interrupts it (best with headphones)
barge_in_max_s = 2.0       # speech heard while speaking is checked in slices this long
only_addressed = false     # true: without the wake word only questions, "dimmi..." or the name reach Claude

# Noise transcribed as words (the TV, a cough): what never reaches Claude. Local commands are
# never judged. Every drop is logged in logs/metrics.jsonl as drop_reason = "noise" with
# stt_no_speech, stt_logprob and speech_dbfs: tune the values below on those rows.
[noise]
enabled = true
max_words = 4              # only phrases this short are judged on Whisper's confidence
no_speech_prob = 0.5       # a phrase is noise when every segment is above this...
avg_logprob = -0.8         # ...or below this
min_speech_dbfs = -45.0    # loudest 32 ms quieter than this: nobody is talking to the microphone
answer_min_dbfs = -35.0    # a "sì" to "Confermi?" quieter than this is the TV: not confirmed

[cost]
pricing_file = "config/pricing.toml"  # prices per model and cache multipliers (never in the code)
db_file = "data/spend.db"             # SQLite ledger of every Claude call (tokens, cache, cost)
daily_budget = 1.0                    # USD per day: warning at warn_at, Claude blocked at 100 %
warn_at = 0.8                         # local commands keep working when the budget is spent

# Claude answers what no local command understands. The key goes in .env (ANTHROPIC_API_KEY),
# never here. Every call is counted in [cost]: warning at warn_at, blocked at 100 %.
[claude]
enabled = true                 # false: local commands only, zero cost
model = "claude-haiku-5-5"     # must be in config/pricing.toml
max_tokens = 300               # a spoken reply: 2-4 sentences
effort = "low"                 # low | medium | high: low = fastest first word
thinking = false               # Haiku thinks by default: off saves latency and tokens
timeout_s = 10.0
history_turns = 6              # question/answer pairs sent back as context (0 = none)
history_reset_s = 300          # after 5 minutes of silence the context starts over
conversation_min_words = 3     # without the wake word: shorter phrases are not sent to Claude
cache = true                   # prompt caching: from the 2nd turn the conversation costs 10 %
tell_time = true               # Claude gets the local date and time with each request
keepalive_s = 60               # the connection to the API stays open this long between requests
# Sonnet for reasoning: Haiku hands a request over by itself (escalate), or say "pensaci bene".
smart_model = "claude-sonnet-5-5"  # must be in config/pricing.toml; "" = Haiku only
smart_effort = "low"           # low | medium | high
smart_max_tokens = 1024        # its thinking counts here too
escalate = true
smart_phrases = { it = ["pensaci bene", "ragionaci", "ragiona bene", "pensaci su"], en = ["think hard", "think carefully", "think it through"] }
# A request for detail: Claudio asks "Lo uso?" for Sonnet at once (no Haiku call).
offer_phrases = { it = ["in dettaglio", "nel dettaglio", "approfondisci", "spiegami bene", "a fondo"], en = ["in detail", "in depth", "explain thoroughly"] }

# The chat window (uv run claudio --ui): what you write there reaches the running assistant.
[chat]
typed = true                   # answer the messages written in the window
speak_typed = false            # true: say the reply aloud too
poll_s = 0.3
max_age_s = 120                # messages written while Claudio was off are dropped

[logging]
level = "INFO"
save_audio = true          # keep a WAV of what CLAUDIO heard after each wake word (logs/audio/)
keep_audio = 50            # how many to keep
retention_days = 30        # the chat (data/claudio.db), logs/sessions/ and logs/audio/ forget what is older (at startup)
