reply = "Apro la calcolatrice."

[[command]]
id = "volume_up"
phrases = ["alza il volume", "volume su", "aumenta il volume", "alza l audio", "piu volume", "alza"]
action = "media_key"
params = { key = "volume_up", steps = 5 }
reply = "Volume alzato."

[[command]]
id = "volume_down"
phrases = ["abbassa il volume", "volume giu", "diminuisci il volume", "abbassa l audio", "meno volume", "abbassa"]
action = "media_key"
params = { key = "volume_down", steps = 5 }
reply = "Volume abbassato."

[[command]]
id = "mute"
phrases = ["togli l audio", "muto", "silenzia", "disattiva l audio", "metti in muto", "togli il volume", "riattiva l audio"]
action = "media_key"
params = { key = "mute", steps = 1 }
reply = ""

[[command]]
id = "tell_time"
phrases = ["che ore sono", "che ora e", "dimmi l ora", "mi dici l ora", "sai che ore sono"]
action = "tell_time"
reply = ""

[[command]]
id = "tell_date"
phrases = ["che giorno e oggi", "che giorno e", "quanti ne abbiamo oggi", "dimmi la data", "che data e oggi"]
action = "tell_date"
reply = ""
