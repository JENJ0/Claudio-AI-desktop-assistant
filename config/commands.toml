[[command]]
id = "tell_time"
phrases = ["che ore sono", "che ora e", "dimmi l ora", "mi dici l ora", "sai che ore sono"]
phrases_en = ["what time is it", "what's the time", "tell me the time", "do you know what time it is", "what time is it now"]
keywords_en = ["time"]  # "what's the tide" is close to "what's the time"
action = "tell_time"
reply = ""
reply_en = ""

[[command]]
id = "tell_date"
phrases = ["che giorno e oggi", "che giorno e", "quanti ne abbiamo oggi", "dimmi la data", "che data e oggi"]
phrases_en = ["what day is it today", "what day is it", "what's the date", "what's the date today", "tell me the date", "what's today's date"]
keywords_en = ["date", "day"]  # "what's the weather today" is close to "what's the date today"
action = "tell_date"
reply = ""
reply_en = ""

[[command]]
id = "tell_spend"
phrases = ["quanto ho speso oggi", "quanto ho speso", "quanto abbiamo speso oggi", "dimmi la spesa di oggi", "quanto costa oggi"]
phrases_en = ["how much did i spend today", "how much have i spent", "what did i spend today", "tell me today's spending"]
keywords = ["speso", "spesa", "costa"]
keywords_en = ["spend", "spent", "spending"]
action = "tell_spend"
reply = ""
reply_en = ""

# System commands: also heard while paused (then they are the only ones answered).
# "already" is said when there is nothing to change (pausing while already paused).
[[command]]
id = "pause"
phrases = ["vai in pausa", "mettiti in pausa", "fai una pausa", "vai a dormire", "dormi", "vai a nanna"]
phrases_en = ["go to sleep", "pause", "take a break", "sleep"]
action = "system"
params = { do = "pause", already = "Sono già in pausa.", already_en = "I'm already paused." }
reply = "Vado in pausa. Per riattivarmi chiamami e di' svegliati."
reply_en = "Pausing. To wake me up, call me and say wake up."

[[command]]
id = "resume"
phrases = ["svegliati", "sveglia", "torna attivo", "riattivati", "esci dalla pausa", "sei sveglio"]
phrases_en = ["wake up", "resume", "unpause", "are you awake", "come back"]
action = "system"
params = { do = "resume", already = "Sono già sveglio.", already_en = "I'm already awake." }
reply = "Eccomi."
reply_en = "I'm here."

[[command]]
id = "shutdown"
phrases = ["spegniti", "spengiti", "spegniti pure", "ora spegniti", "puoi spegnerti"]
phrases_en = ["shut down", "shut yourself down", "turn yourself off", "switch yourself off"]
action = "system"
exact = true  # no fuzzy match: "spegni la luce" or "shut down the PC" must not close CLAUDIO
params = { do = "shutdown" }
reply = "A presto."
reply_en = "See you soon."
