# Local commands recognised without any LLM (zero cost).
# Each command: phrases (examples, matched exactly and fuzzily after
# normalisation; exact = true turns the fuzzy match off), action, optional params and the
# spoken reply. `phrases` and `reply` are Italian; `phrases_en` and `reply_en` the same in
# English (any two-letter language works the same way). CLAUDIO answers in the language of
# the phrase it recognised; a missing reply_xx falls back to the Italian one (reply and
# voice). keywords_xx: words a fuzzy match in that language must contain.
# Adding a command here needs no Python change if the action already exists.
# Actions: open_app, open_folder, media_key, tell_time, tell_date, tell_spend, system.

[[command]]
id = "open_chrome"
phrases = ["apri chrome", "apri google chrome", "apri il browser", "avvia chrome", "lancia chrome", "apri internet"]
phrases_en = ["open chrome", "open google chrome", "open the browser", "start chrome", "launch chrome", "open the internet"]
action = "open_app"
params = { app = "chrome" }
reply = "Apro Chrome."
reply_en = "Opening Chrome."

[[command]]
id = "open_downloads"
phrases = ["apri la cartella download", "apri download", "apri i download", "apri la cartella dei download", "mostra i download", "vai su download"]
