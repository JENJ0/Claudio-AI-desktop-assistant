# Local commands recognised without any LLM (zero cost).
# Each command: phrases (examples, matched exactly and fuzzily after
# normalisation), action, optional params and the spoken reply.
# Adding a command here needs no Python change if the action already exists.
# Actions: open_app, open_folder, media_key, tell_time, tell_date.

[[command]]
id = "open_chrome"
phrases = ["apri chrome", "apri google chrome", "apri il browser", "avvia chrome", "lancia chrome", "apri internet"]
action = "open_app"
params = { app = "chrome" }
reply = "Apro Chrome."

[[command]]
id = "open_downloads"
phrases = ["apri la cartella download", "apri download", "apri i download", "apri la cartella dei download", "mostra i download", "vai su download"]
action = "open_folder"
params = { folder = "downloads" }
reply = "Apro la cartella Download."

[[command]]
id = "open_documents"
phrases = ["apri documenti", "apri la cartella documenti", "apri i documenti", "mostra i documenti", "vai su documenti"]
action = "open_folder"
params = { folder = "documents" }
reply = "Apro Documenti."

[[command]]
id = "open_explorer"
phrases = ["apri esplora file", "apri esplora risorse", "apri il file explorer", "apri gestione file", "apri le cartelle"]
action = "open_folder"
params = { folder = "explorer" }
reply = "Apro Esplora file."

[[command]]
id = "open_notepad"
