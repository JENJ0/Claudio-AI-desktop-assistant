# Local commands recognised without any LLM (zero cost).
# Each command: phrases (examples, matched exactly and fuzzily after
# normalisation; exact = true turns the fuzzy match off), action, optional params and the
# spoken reply, all in Italian. keywords: words a fuzzy match must contain.
# Adding a command here needs no Python change if the action already exists.
# Actions: open_app, open_folder, media_key, tell_time, tell_date, tell_spend, close_window, system,
# chat, memory, repeat, resume, stop.

[[command]]
id = "open_chrome"
phrases = ["apri chrome", "apri google chrome", "apri il browser", "avvia chrome", "lancia chrome", "apri internet"]
action = "open_app"
params = { app = "chrome" }
reply = "Apro Chrome."

[[command]]
id = "open_downloads"
phrases = ["apri la cartella download", "apri download", "apri i download", "apri la cartella dei download", "mostra i download", "vai su download"]
action = "open_folder"
params = { folder = "downloads" }
reply = "Apro la cartella Download."

[[command]]
id = "open_documents"
phrases = ["apri documenti", "apri la cartella documenti", "apri i documenti", "mostra i documenti", "vai su documenti"]
action = "open_folder"
params = { folder = "documents" }
reply = "Apro Documenti."

[[command]]
id = "open_explorer"
phrases = ["apri esplora file", "apri esplora risorse", "apri il file explorer", "apri gestione file", "apri le cartelle"]
action = "open_folder"
params = { folder = "explorer" }
reply = "Apro Esplora file."

[[command]]
id = "open_notepad"
phrases = ["apri il blocco note", "apri blocco note", "apri notepad", "avvia il blocco note", "apri il blocco notes"]
action = "open_app"
params = { app = "notepad" }
reply = "Apro il Blocco note."

[[command]]
id = "open_calculator"
phrases = ["apri la calcolatrice", "apri calcolatrice", "avvia la calcolatrice", "lancia la calcolatrice", "calcolatrice"]
action = "open_app"
params = { app = "calculator" }
reply = "Apro la calcolatrice."

[[command]]
id = "volume_up"
phrases = ["alza il volume", "volume su", "aumenta il volume", "alza l audio", "piu volume", "alza"]
action = "media_key"
params = { key = "volume_up", steps = 5 }
reply = "Volume alzato."

[[command]]
id = "volume_down"
phrases = ["abbassa il volume", "volume giu", "diminuisci il volume", "abbassa l audio", "meno volume", "abbassa"]
action = "media_key"
params = { key = "volume_down", steps = 5 }
reply = "Volume abbassato."

[[command]]
id = "mute"
phrases = ["togli l audio", "muto", "silenzia", "disattiva l audio", "metti in muto", "togli il volume", "riattiva l audio"]
action = "media_key"
params = { key = "mute", steps = 1 }
reply = ""

# Media keys: the player in use (Spotify, YouTube...) gets them even in the background.
# "salta 3 canzoni" presses the key 3 times.
[[command]]
id = "media_play_pause"
phrases = ["metti in pausa la musica", "pausa la musica", "ferma la musica", "riprendi la musica", "fai ripartire la musica", "metti play", "play", "fai partire la musica", "metti in pausa il video", "riprendi il video"]
keywords = ["musica", "video", "play", "canzone", "brano"]
action = "media_key"
params = { key = "play_pause", steps = 1 }
reply = ""

[[command]]
id = "media_next"
phrases = ["canzone successiva", "prossima canzone", "brano successivo", "traccia successiva", "salta la canzone", "salta canzone", "passa alla prossima", "metti la prossima", "video successivo"]
keywords = ["successiva", "successivo", "prossima", "prossimo", "salta"]
action = "media_key"
params = { key = "next_track", steps = 1 }
reply = ""

[[command]]
id = "media_previous"
phrases = ["canzone precedente", "brano precedente", "traccia precedente", "torna alla canzone di prima", "metti la canzone di prima", "video precedente"]
keywords = ["precedente", "prima"]
action = "media_key"
params = { key = "previous_track", steps = 1 }
reply = ""

[[command]]
id = "tell_time"
phrases = ["che ore sono", "che ora e", "dimmi l ora", "mi dici l ora", "sai che ore sono"]
action = "tell_time"
reply = ""

[[command]]
id = "tell_date"
phrases = ["che giorno e oggi", "che giorno e", "quanti ne abbiamo oggi", "dimmi la data", "che data e oggi"]
action = "tell_date"
reply = ""

[[command]]
id = "tell_spend"
phrases = ["quanto ho speso oggi", "quanto ho speso", "quanto abbiamo speso oggi", "dimmi la spesa di oggi", "quanto costa oggi"]
keywords = ["speso", "spesa", "costa"]
action = "tell_spend"
reply = ""

# Safety levels (level = 1 | 2 | 3, default 1). Level 2: CLAUDIO asks `confirm` and a yes runs
# the action; level 3: `confirm` is the summary of what will happen and only "confermo"
# runs it. Anything else cancels. Used here as the test of the mechanism.
[[command]]
id = "close_window"
phrases = ["chiudi la finestra", "chiudi finestra", "chiudi questa finestra", "chiudi la finestra attiva"]
action = "close_window"
level = 2
confirm = "Chiudo la finestra in primo piano. Confermi?"
reply = "Fatto."

# The chat window (the same as `claudio --ui`), opened by the running assistant. Add your own
# phrases here: they are matched locally, at no cost.
[[command]]
id = "open_chat"
phrases = ["apri la chat", "apri chat", "chat", "la chat", "fammi scrivere", "voglio scrivere", "mostra la chat", "apri la finestra della chat", "fammi vedere la chat"]
keywords = ["chat", "scrivere"]
action = "chat"
params = { do = "open", already = "La chat è già aperta.", unavailable = "Qui la chat non si può aprire." }
reply = "Apro la chat."

[[command]]
id = "close_chat"
phrases = ["chiudi la chat", "chiudi chat", "chiudi la finestra della chat", "nascondi la chat"]
keywords = ["chat"]
action = "chat"
params = { do = "close", already = "La chat non è aperta.", unavailable = "Qui la chat non si può aprire." }
reply = "Chiudo la chat."

# Memory (src/claudio/memory/): the fixed phrases. "ricordati che...", "dimentica X",
# "dimenticalo" and "cosa ricordi di X" depend on the text or on what was just said and are
# understood in memory/voice.py. exact = true: "dimentica tutto quello di Anna" must not
# become "dimentica tutto".
[[command]]
id = "memory_list"
phrases = ["cosa ricordi", "che cosa ricordi", "cosa ti ricordi", "che cosa ti ricordi", "cosa ricordi di me", "cosa sai di me", "che cosa sai di me", "che sai di me", "elenca i ricordi", "quali ricordi hai", "cosa hai in memoria", "cosa c e nella tua memoria"]
action = "memory"
exact = true
params = { do = "list", unavailable = "La memoria è spenta." }

[[command]]
id = "memory_wipe"
phrases = ["dimentica tutto", "dimenticati tutto", "scordati tutto", "dimentica tutto quello che sai", "dimentica tutti i ricordi", "cancella tutti i ricordi", "cancella la memoria", "cancella tutta la memoria", "svuota la memoria"]
action = "memory"
exact = true
level = 3
confirm = "Cancello tutti i ricordi, per sempre. Per procedere dì: confermo."
params = { do = "wipe", unavailable = "La memoria è spenta." }

# Conversation: "ripeti" says the last reply again; "basta" ends the conversation (CLAUDIO
# stops listening without the wake word) and, said while CLAUDIO speaks, interrupts it.
# exact = true: "basta" must be all that was said, so a longer request is never cut short.
[[command]]
id = "repeat"
phrases = ["ripeti", "puoi ripetere", "ripeti per favore", "ripetilo", "ridillo", "cosa hai detto", "come hai detto", "non ho capito", "me lo ripeti"]
keywords = ["ripeti", "ripetere", "ripetilo", "ridillo", "detto", "capito"]
action = "repeat"
params = { empty = "Non ho ancora detto niente." }
reply = ""

# "continua": says again the text still missing of a reply that was cut, for free. Only while there is
# one (the Assistant knows); else the phrase goes to Claude, as if no command matched.
[[command]]
id = "continue_reply"
phrases = ["continua", "riprendi", "continua la storia", "riprendi la storia", "vai avanti"]
exact = true
action = "resume"
reply = ""

[[command]]
id = "stop"
phrases = ["basta", "basta cosi", "stop", "zitto", "stai zitto", "fermati", "silenzio", "smettila", "ho finito", "lascia stare", "niente", "non parlare"]
action = "stop"
exact = true
reply = ""

# System commands: also heard while paused (then they are the only ones answered).
# "already" is said when there is nothing to change (pausing while already paused).
[[command]]
id = "pause"
phrases = ["vai in pausa", "mettiti in pausa", "fai una pausa", "vai a dormire", "dormi", "vai a nanna"]
action = "system"
params = { do = "pause", already = "Sono già in pausa." }
reply = "Vado in pausa. Per riattivarmi chiamami e di' svegliati."

[[command]]
id = "resume"
phrases = ["svegliati", "sveglia", "torna attivo", "riattivati", "esci dalla pausa", "sei sveglio"]
action = "system"
params = { do = "resume", already = "Sono già sveglio." }
reply = "Eccomi."

# Off: no beeps and no replies until "accenditi" (only the wake word listens, a bit stricter).
# exact = true: "spegni la luce" / "accendi la luce" must never switch CLAUDIO off or on.
[[command]]
id = "off"
phrases = ["spegniti", "spengiti", "spegniti pure", "ora spegniti", "puoi spegnerti", "smetti di ascoltare"]
action = "system"
exact = true
params = { do = "off", already = "Sono già spento." }
reply = "Mi spengo. Per riaccendermi di' Claudio, accenditi."

[[command]]
id = "on"
phrases = ["accenditi", "riaccenditi", "accenditi pure", "ora accenditi", "puoi accenderti", "torna ad ascoltare"]
action = "system"
exact = true
params = { do = "on", already = "Sono già acceso." }
reply = "Eccomi, sono acceso."

# Shutdown closes the program ("chiuditi"); "spegniti" is the off command above.
[[command]]
id = "shutdown"
phrases = ["chiuditi", "chiuditi pure", "ora chiuditi", "puoi chiuderti", "esci dal programma"]
action = "system"
exact = true  # no fuzzy match: "spegni la luce" or "shut down the PC" must not close CLAUDIO
params = { do = "shutdown" }
reply = "A presto."
