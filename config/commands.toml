action = "tell_spend"
reply = ""
reply_en = ""

# Safety levels (level = 1 | 2 | 3, default 1). Level 2: CLAUDIO asks `confirm` and a yes runs
# the action; level 3: `confirm` is the summary of what will happen and only "confermo" /
# "I confirm" runs it. Anything else cancels. Used here as the test of the mechanism.
[[command]]
id = "close_window"
phrases = ["chiudi la finestra", "chiudi finestra", "chiudi questa finestra", "chiudi la finestra attiva"]
phrases_en = ["close the window", "close window", "close this window", "close the active window"]
action = "close_window"
level = 2
confirm = "Chiudo la finestra in primo piano. Confermi?"
confirm_en = "I'll close the window in front. Do you confirm?"
reply = "Fatto."
reply_en = "Done."

# The chat window (the same as `claudio --ui`), opened by the running assistant. Add your own
# phrases here: they are matched locally, at no cost.
[[command]]
id = "open_chat"
phrases = ["apri la chat", "apri chat", "chat", "la chat", "fammi scrivere", "voglio scrivere", "mostra la chat", "apri la finestra della chat", "fammi vedere la chat"]
phrases_en = ["open the chat", "open chat", "chat", "show the chat", "let me type", "i want to type", "open the chat window"]
keywords = ["chat", "scrivere"]
keywords_en = ["chat", "type"]
action = "chat"
params = { do = "open", already = "La chat è già aperta.", already_en = "The chat is already open.", unavailable = "Qui la chat non si può aprire.", unavailable_en = "I can't open the chat here." }
reply = "Apro la chat."
reply_en = "Opening the chat."

[[command]]
id = "close_chat"
phrases = ["chiudi la chat", "chiudi chat", "chiudi la finestra della chat", "nascondi la chat"]
phrases_en = ["close the chat", "close chat", "hide the chat", "close the chat window"]
keywords = ["chat"]
keywords_en = ["chat"]
action = "chat"
params = { do = "close", already = "La chat non è aperta.", already_en = "The chat isn't open.", unavailable = "Qui la chat non si può aprire.", unavailable_en = "I can't open the chat here." }
reply = "Chiudo la chat."
reply_en = "Closing the chat."

# Conversation: "ripeti" says the last reply again; "basta" ends the conversation (CLAUDIO
# stops listening without the wake word) and, said while CLAUDIO speaks, interrupts it.
# exact = true: "basta" must be all that was said, so a longer request is never cut short.
[[command]]
id = "repeat"
phrases = ["ripeti", "puoi ripetere", "ripeti per favore", "ripetilo", "ridillo", "cosa hai detto", "come hai detto", "non ho capito", "me lo ripeti"]
phrases_en = ["repeat", "repeat that", "say that again", "can you repeat", "what did you say", "come again", "pardon", "i didn't get that"]
keywords = ["ripeti", "ripetere", "ripetilo", "ridillo", "detto", "capito"]
keywords_en = ["repeat", "again", "say", "pardon"]
action = "repeat"
params = { empty = "Non ho ancora detto niente.", empty_en = "I haven't said anything yet." }
reply = ""
reply_en = ""

[[command]]
id = "stop"
phrases = ["basta", "basta cosi", "stop", "zitto", "stai zitto", "fermati", "silenzio", "smettila", "ho finito", "lascia stare", "niente"]
phrases_en = ["stop", "enough", "that's enough", "shut up", "be quiet", "quiet", "never mind", "i'm done", "nothing"]
action = "stop"
exact = true
reply = ""
reply_en = ""

# System commands: also heard while paused (then they are the only ones answered).
# "already" is said when there is nothing to change (pausing while already paused).
[[command]]
id = "pause"
phrases = ["vai in pausa", "mettiti in pausa", "fai una pausa", "vai a dormire", "dormi", "vai a nanna"]
phrases_en = ["go to sleep", "pause", "take a break", "sleep"]
action = "system"
params = { do = "pause", already = "Sono già in pausa.", already_en = "I'm already paused." }
reply = "Vado in pausa. Per riattivarmi chiamami e di' svegliati."
reply_en = "Pausing. To wake me up, call me and say wake up."

[[command]]
id = "resume"
phrases = ["svegliati", "sveglia", "torna attivo", "riattivati", "esci dalla pausa", "sei sveglio"]
phrases_en = ["wake up", "resume", "unpause", "are you awake", "come back"]
action = "system"
params = { do = "resume", already = "Sono già sveglio.", already_en = "I'm already awake." }
reply = "Eccomi."
reply_en = "I'm here."

[[command]]
id = "shutdown"
phrases = ["spegniti", "spengiti", "spegniti pure", "ora spegniti", "puoi spegnerti", "chiuditi", "chiuditi pure"]
phrases_en = ["shut down", "shut yourself down", "turn yourself off", "switch yourself off"]
action = "system"
exact = true  # no fuzzy match: "spegni la luce" or "shut down the PC" must not close CLAUDIO
params = { do = "shutdown" }
reply = "A presto."
reply_en = "See you soon."
