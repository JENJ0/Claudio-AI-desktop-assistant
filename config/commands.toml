phrases_en = ["pause the music", "stop the music", "resume the music", "play the music", "play music", "play", "pause the video", "resume the video"]
keywords = ["musica", "video", "play", "canzone", "brano"]
keywords_en = ["music", "video", "play", "song"]
action = "media_key"
params = { key = "play_pause", steps = 1 }
reply = ""
reply_en = ""

